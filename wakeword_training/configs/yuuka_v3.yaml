# Piper VITS sampling diversity. slerp_weights blends speaker embeddings across
# the ~900 LibriTTS speakers; length_scales varies speaking rate.
#
# noise_scale_ws drives the STOCHASTIC DURATION PREDICTOR, whose output is
# exponentiated with no upper bound (see wakeword_patches.py's duration guard).
#
# Lowered to 0.6/0.8 because en-us-libritts-high.json declares `noise_w: 0.8` as
# the value this checkpoint was tuned for; the library default of 0.98 exceeds
# it. To be accurate about what this buys: measured over 800 draws, 0.98's
# natural maximum utterance is 3.1s vs 2.9s at 0.8 — so 0.98 is NOT what caused
# the 4.4 GB OOM, it only fattens the tail slightly. The runaway is a rare draw
# (logw ~8, ~1000x normal) that the SDP can produce at any noise_w. The duration
# guard is the actual fix; this is prudence, not the remedy.
noise_scales: [0.667, 0.8]
noise_scale_ws: [0.6, 0.8]
length_scales: [0.75, 0.9, 1.0, 1.1, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]
max_speakers: null

# Shared with v1/v2 — the ~22 GB setup download (ACAV100M bank, RIRs) is
# reused. model_output_dir = output_dir/model_name, so v3 cannot collide with
# earlier runs. Relative to repo root, NOT this machine's absolute path: run
# from the repo root, not from wakeword_training/.
data_dir: ./wakeword_training/data
output_dir: ./wakeword_training/output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  # 591 ~8s chunks, not the single 147MB source — parallel workers all reading
  # one large file stalls on disk contention. Unchanged from v2.
  background_paths: [./wakeword_training/data/backgrounds_chunked]
  rir_paths: [./wakeword_training/data/rirs]
  n_workers: 0
  mp_context: auto

feature_extraction:
  n_workers: 0
  execution_providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]

eval:
  execution_providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]
  batch_size: 64

model:
  model_type: conv_attention
  model_size: medium

steps: 50000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
# See note 4 in the header.
max_negative_weight: 1000
target_fp_per_hour: 0.2

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50

# =============================================================================
# Reading the result
#
# Aggregate recall in eval.json will NOT tell you whether the long phrase
# helped — it pools short and long positives. Run:
#     python wakeword_training/eval_per_phrase.py --config <this file>
# and read the short-form and long-form rows separately, the way takoyaki split
# tako-yaki / tahkoyaki / hey tako.
#
# The signal that the negative fix worked is `optimal_threshold` rising off
# 0.01-0.02 toward a normal operating point, with fpph staying sane now that
# hard negatives are actually present in validation. v1/v2's fpph figures are
# NOT a valid baseline for that comparison — they were measured against junk.
# Rank against v2 with compare_models.py at a matched FPPH budget, never by
# eval.json alone.
# =============================================================================
