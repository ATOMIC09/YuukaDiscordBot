# =============================================================================
# ##  REJECTED — DO NOT PROMOTE THIS MODEL. Kept for the record only.  ##
#
# v3 produced the best synthetic numbers of any run (82.9% recall @0.5, and
# optimal_threshold finally decompressed from 0.01 to 0.86) and was clearly
# WORSE in the bot: it will not spike above 0.6 on a real Thai-accented voice,
# where v2 fires reliably. It is 17-36 points behind v2 at every matched FPPH
# budget on a common eval set, and near-blind on TTS engines it never saw
# (3.4% of Edge-TTS wake words vs v2's 52.7%).
#
# Cause: swapping VoxCPM2 for Piper traded away accent diversity, and the eval
# could not detect it because train and validation came from the same engine.
# Full analysis and numbers: TRAINING.md, "Why v3 lost: single-TTS overfitting".
#
# Worth reusing in v4: the curated negatives below, and max_negative_weight /
# target_fp_per_hour (1000 / 0.2), which is what fixed the score compression.
# Not worth reusing: tts_backend piper_vits on its own, and the romanized
# English-only target_phrases that come with it.
# =============================================================================
#
# Yuuka wake-word config — v3: Piper rebaseline with a real hard-negative set
#
# v3 is a deliberate from-scratch rebaseline, not an incremental v2 tweak.
# Four things change together; see "Reading the result" at the bottom for how
# to attribute the outcome.
#
# 1. TTS: voxcpm -> piper_vits.
#    "Yuuka" is one acoustic target, /juu-ka/, in every language a speaker of
#    this bot uses. Thai "ยูกะ" and Japanese "ユーカ" are the same sound as
#    "yuuka" — the classifier reads the Google speech_embedding, which is
#    phonetic, not orthographic, so the six script spellings in v1/v2 were six
#    near-duplicate acoustic targets. VoxCPM2's multilingual phonemization was
#    buying redundancy at ~1.6 s/clip (measured, RTX 3070). Piper VITS is one
#    non-autoregressive forward pass — no AR decode, no 8-12 flow-matching
#    steps, no CFG double-forward — and phonemizes any spelling through
#    `espeak-ng --ipa`. Expect `generate` to drop from ~20 h to well under an
#    hour, which is what makes iterating on this model practical at all.
#
#    Lost in the trade: VoxCPM2's `voice_design_prompts` accent personas.
#    Piper's en-us-libritts-high is ~900 native-American-English speakers,
#    diversified by SLERP blending (`slerp_weights`) and `length_scales`.
#    Speaker variety, yes; non-native accent variety, no. If v3's real-world
#    recall is weak specifically for Thai-accented speakers, that is the known
#    gap to close next — with real recorded positives, not by going back.
#
# 2. Target phrases: only spellings that survive CMUDict pre-normalization.
#    `normalize_phrases_for_piper` (piper_backend.py:62) splits unknown words
#    into known subwords before espeak sees them, so "yuka" becomes "yu ka" —
#    two words with a boundary, not the wake word. Every spelling below was
#    verified to pass through intact. Do not add one without checking:
#      python wakeword_training/check_pronunciation.py --config <this file>
#
# 3. A long form ("hey yuuka") joins the short form, 50/50.
#    takoyaki's V1 measured 95.8% recall on 4-syllable "tako-yaki" against
#    54.6% on 2-syllable "hey tako" in one model. v2's aggregate 59.3% is
#    squarely the short-phrase regime. This tests whether length is the
#    binding constraint here too.
#
# 4. max_negative_weight 3000 -> 1000, target_fp_per_hour 0.1 -> 0.2.
#    v1/v2 both landed at optimal_threshold 0.01-0.02, i.e. the entire useful
#    score range was compressed below 0.02 — the mild form of the collapse
#    takoyaki documented at high negative weight on a compressed schedule.
#    These values also sit nearer the library defaults (1500 / 0.2).
#
# Run it exactly like v1/v2 — stock CLI, config positional (except `setup`):
#     $env:PYTHONUTF8="1"
#     & $py -m livekit.wakeword setup    --config wakeword_training/configs/yuuka_v3.yaml
#     & $py -m livekit.wakeword generate wakeword_training/configs/yuuka_v3.yaml
#     ... augment / train / export / eval
#
# Two Piper bugs with no config knob (a per-clip espeak subprocess costing ~70x
# throughput, and an unbounded duration prediction that OOMs the GPU) are fixed
# by setup_env.ps1 step 3b, which patches site-packages the same way step 3
# swaps webrtcvad. Nothing to remember at run time; re-run setup_env.ps1 after
# any reinstall, since `uv sync` restores the unpatched file.
# =============================================================================

model_name: yuuka_wakeword_v3

# DO NOT hand-edit these without re-running check_pronunciation.py.
#
# The obvious spellings are wrong. espeak reads a doubled "uu" as two separate
# /juː/ glides, so "yuuka" phonemizes to /jˈuːjuːkə/ — "yoo-YOO-kuh", three
# syllables, not the wake word. The first draft of this config used five such
# spellings and would have trained the model on a word nobody says.
#
# All eight below were verified through both stages (CMUDict normalization +
# espeak IPA) and give eight distinct, correct pronunciations:
#
#   yoocah      jˈuːkə        hey yoocah      hˈeɪ jˈuːkə
#   yoocaa      jˈuːkɑː       hey yoocaa      hˈeɪ jˈuːkɑː
#   yoocuh      jˈuːkʌ        hey yoocuh      hˈeɪ jˈuːkʌ
#   yoo-cah     jˈuːkˈɑː      hey yoo-cah     hˈeɪ jˈuːkˈɑː
#
# The four short forms are one word with four final-vowel realizations —
# schwa, open /ɑː/, strut /ʌ/, and a second-syllable stress. That spread is
# deliberate: a Thai speaker's "ยูกะ" ends in a short open /a/, an English
# speaker's ends in a schwa. This is takoyaki's tako-yaki/tahkoyaki trick,
# and it is the only accent variation available now that Piper has replaced
# VoxCPM2's voice_design_prompts. Round-robin assignment
# (`index % len(phrases)`) makes the short/long split exactly 50/50.
target_phrases:
  - "yoocah"
  - "yoocaa"
  - "yoocuh"
  - "yoo-cah"
  - "hey yoocah"
  - "hey yoocaa"
  - "hey yoocuh"
  - "hey yoo-cah"

tts_backend: piper_vits

piper_tts:
  # Resolves under data_dir; `setup` downloads en-us-libritts-high here.
  checkpoint_relpath: piper/en-us-libritts-high.pt

# Held at v2's scale so recall is comparable at a matched FPPH budget. Piper
# makes this cheap now — scaling to takoyaki's 50,000 is minutes, not nights —
# but change one thing at a time: rebaseline first, then scale.
n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 400
# 32, not 64. VITS pads every tensor in a batch to the longest predicted
# duration in it, so one runaway sample inflates the whole batch — halving the
# batch halves the blast radius. takoyaki landed on the same number after
# Piper drove their machine into DPC_WATCHDOG_VIOLATION.
tts_batch_size: 32

# Curated hard negatives — phrases the model must NOT wake on. These sit near
# the decision boundary; the ACAV100M bank supplies ordinary speech separately.
#
# In the YAML, as in v1/v2. The library appends these to the auto-generated
# adversarial pool, and for v3 that pool is 1,269 phrases — so the combined pool
# (1,456) is SMALLER than n_samples_val (5,000) and cycles 3.4x through the
# validation split. Verified: all 187 reach both negative_train and
# negative_test, at ~12.8% of the negative set.
#
# This did NOT hold for v1/v2, and it is worth knowing why. Their pool was 5,529
# (the CMUDict search returns far more neighbours for "yuka" than for "yoocah"),
# which is larger than n_samples_val, so clip assignment `phrases[i % len(pool)]`
# only ever consumed a prefix — and because the library appends custom phrases
# AFTER its internal shuffle, the curated list sat in the tail and the validation
# split never reached it. Every fpph number in v1/v2's eval JSON was measured
# against zero hard negatives. Switching to Piper spellings shrank the auto pool
# enough that the problem disappeared on its own.
#
# If you ever enlarge target_phrases or shrink n_samples_val, re-check that
# `len(auto) + len(custom) < n_samples_val` still holds.
custom_negative_phrases:
  # Hard negatives for the Yuuka wake word — Piper/espeak (en-us) romanized.
  #
  # WHY ROMANIZED: the classifier consumes the Google speech_embedding, which is
  # phonetic, not orthographic. "ยูกิ", "ゆき" and "yuki" are one acoustic target.
  # Piper phonemizes through `espeak-ng --ipa -v en-us`, so entries are spelled
  # to make espeak produce the intended sound, not to be correct in any language.
  #
  # RULE FOR ADDING: it must be plausibly confusable with "yoocah" / "hey yoocah".
  # Generic sentences ("please turn off the lights") are NOT hard negatives — the
  # ACAV100M bank already supplies 2,000 hours of ordinary speech. Only entries
  # that sit near the decision boundary belong here.
  #
  # RULE FOR NOT ADDING: never add a homophone of a target. Target spellings are
  # yoocah / yoocaa / yoocuh / yoo-cah and their "hey" forms, so none of
  # those may appear below. Training near-identical audio as both classes gives
  # contradictory supervision — the mistake takoyaki caught with "taco yaki".
  # check_pronunciation.py enforces this automatically once espeak-ng is present.
  #

  # ------------------------------------------------------------------------
  # The -uka / -uca nucleus: the single hardest family
  # ------------------------------------------------------------------------
  - "asuka"
  - "haruka"
  - "shizuka"
  - "yuzuka"
  - "otsuka"
  - "fukuoka"
  - "okinawa"
  - "osaka"
  - "shizuoka"
  - "tanuka"
  - "luka"
  - "lucca"
  - "luca"
  - "buka"
  - "yucca"
  - "yakuza"
  - "eureka"
  - "bazooka"
  - "chewbacca"
  - "hanukkah"
  - "tapioca"
  - "paprika"
  - "harmonica"
  - "veronica"
  - "monica"
  - "replica"
  - "basilica"
  - "angelica"
  - "yukon"
  - "ruka"
  - "nuka"
  - "duka"
  - "tuka"
  - "muka"
  - "kuka"
  - "suka"
  - "puka"
  - "juka"
  - "guka"
  - "zuka"

  # ------------------------------------------------------------------------
  # yuu- plus a different second mora — one phoneme from the target
  # ------------------------------------------------------------------------
  - "yoockee"
  - "yoocko"
  - "yootoh"
  - "yoockya"
  - "yootah"
  - "yuuri"
  - "yoogah"
