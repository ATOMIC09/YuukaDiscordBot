  # ------------------------------------------------------------------------
  # Thai "เฮ้ X" carriers, respelled
  # ------------------------------------------------------------------------
  - "hey yoo gee"
  - "hey yoo ree"
  - "hey yoo nah"
  - "hey yoo nai"
  - "hey doo gan"
  - "hey look kaa"
  - "hey took kon"
  - "hey nai"
  - "hey pheuan"
