  # ------------------------------------------------------------------------
  # Short-vowel and neighbouring-consonant variants
  # ------------------------------------------------------------------------
  - "yuki"
  - "yuna"
  - "yumi"
  - "yuri"
  - "yura"
  - "yuma"
  # NOTE: bare "yuka" is deliberately absent — espeak splits it to "yu ka" and it
  # is too close to the target to be a safe negative.
  - "yurika"
