[project]
name = "yuukadiscordbot"
version = "3.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "py-cord[speed,voice]>=2.8.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "yt-dlp>=2024.0.0",
    "typhoon-asr>=0.1.1",
    "tavily-python>=0.7.26",
    "edge-tts>=7.2.8",
    "pillow>=12.3.0",
    "pet-pet-gif>=1.0.2",
    "qrcode>=8.2",
    "setuptools>=83.0.0",
    "pytz>=2026.2",
]

[dependency-groups]
dev = [
    "bump-my-version>=1.4.1",
]

[tool.bumpversion]
current_version = "3.0.0"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.uv.sources]
py-cord = { git = "https://github.com/Pycord-Development/pycord.git", rev = "refs/pull/3159/head" }
