[project]
name = "yuukadiscordbot"
version = "3.1.0"
description = "Add your description here"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12, <3.14"
dependencies = [
    "py-cord[speed,voice]>=2.8.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "yt-dlp>=2024.0.0",
    "faster-whisper>=1.1.0",
    "rapidfuzz>=3.9.0",
    "tavily-python>=0.7.26",
    "edge-tts>=7.2.8",
    "pillow>=12.3.0",
    "pet-pet-gif>=1.0.2",
    "qrcode>=8.2",
    "setuptools>=83.0.0",
    "pytz>=2026.2",
    "tinytag>=2.2.1",
    "psutil>=7.2.2",
    "livekit-wakeword>=0.2.1",
]

[project.optional-dependencies]
# faster-whisper on a GPU needs cuBLAS and cuDNN 9, which CTranslate2 does not
# bundle and only dlopens on the first inference. Kept out of the base deps:
# it is ~700MB, and the CPU deployment box has no use for it.
# GPU machines: `uv sync --extra cuda`.
cuda = [
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = [
    "bump-my-version>=1.4.1",
]

[tool.bumpversion]
current_version = "3.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.uv.sources]
py-cord = { git = "https://github.com/Pycord-Development/pycord.git", rev = "refs/pull/3159/head" }
